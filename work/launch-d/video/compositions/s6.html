  (() => {

    const FPS = 30;
    const D = { xs: 2, s: 3, m: 6, l: 12, xl: 24, x2l: 30 };   // motion.md 1장 Duration (프레임)
    const H = { s: 12, m: 21, l: 36, end: 45 };                 // motion.md 4장 hold (프레임)
    function bez(x1, y1, x2, y2) {                              // cubic-bezier → 함수 (곡선 값은 motion.md 1장 그대로)
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      return (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let lo = 0, hi = 1, t = p;
        for (let i = 0; i < 50; i++) { const v = sx(t); if (Math.abs(v - p) < 1e-7) break; if (v < p) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const EASE_OUT = bez(0.16, 1, 0.3, 1);     // ease-out
    const EASE_IN = bez(0.5, 0, 0.75, 0);      // ease-in

    const EASE_LINEAR = (p) => Math.min(1, Math.max(0, p)); // ease-linear
    const prog = (f, at, dur, ease) => ease(Math.min(1, Math.max(0, (f - at) / dur)));
    const lerp = (a, b, t) => a + (b - a) * t;
    // 카메라: 월드 점 (cx, cy) 를 화면 가운데에, 배율 s

        if (loaded()) go(); else fr.addEventListener("load", go, { once: true });
      });
    }
    function ready(root) {
      root.querySelectorAll("iframe[data-src]").forEach((fr) => { if (!fr.getAttribute("src")) fr.src = fr.dataset.src; });
      return document.fonts.ready.then(() => Promise.all([

    function run(id, root, frames, paint) {
      const tl = gsap.timeline({ paused: true });
      const c = { f: 0 };
      const go = () => paint(Math.round(c.f * 1e4) / 1e4);
      tl.fromTo(c, { f: 0 }, { f: frames, duration: frames / FPS, ease: "none", onUpdate: go }, 0);
      root.querySelectorAll("iframe").forEach((fr) => fr.addEventListener("load", () => { go(); fr.contentDocument.fonts.ready.then(go); }));
      go();
      window.__timelines[id] = tl;
    }
    const inner = (fr, sel) => fr.contentDocument && fr.contentDocument.querySelector(sel);
    // ────────────────────────────────────────────────────────────────

    const root = document.getElementById("s6-btn").closest('[data-composition-id="s6"]');
    const $ = (s) => root.querySelector(s);
    const PRESS_SCALE = 0.96;                                         // motion.md 1장 press-scale
    const T = { press: 6 * D.xs + D.m + H.m };                        // 18 + 21 = 39
    const C = [...root.querySelectorAll("#s6-line .ch > span")];
    const paint = (f) => {
      C.forEach((el, i) => {
        el.style.transform = `translateY(${(1 - prog(f, Math.min(i, 6) * D.xs, D.m, EASE_OUT)) * 100}%)`;
      });
      const k = f < T.press + D.s ? lerp(1, PRESS_SCALE, prog(f, T.press, D.s, EASE_IN)) : lerp(PRESS_SCALE, 1, prog(f, T.press + D.s, D.m, EASE_OUT));
      $("#s6-btn").style.transform = `scale(${k})`;
    };
    ready(root).then(() => run("s6", root, 48, paint));

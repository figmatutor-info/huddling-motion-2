  <script>
  (() => {
    // ── 공통 (장면 파일마다 같음 · launch-b 와 같은 방식) ─────────────────
    const FPS = 30;
    const D = { xs: 2, s: 3, m: 6, l: 12, xl: 24, x2l: 30 };   // motion.md 1장 Duration (프레임)
    const H = { s: 12, m: 21, l: 36, end: 45 };                 // motion.md 4장 hold (프레임)
    function bez(x1, y1, x2, y2) {                              // cubic-bezier → 함수 (곡선 값은 motion.md 1장 그대로)
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      return (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let lo = 0, hi = 1, t = p;
        for (let i = 0; i < 50; i++) { const v = sx(t); if (Math.abs(v - p) < 1e-7) break; if (v < p) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const EASE_OUT = bez(0.16, 1, 0.3, 1);     // ease-out
    const EASE_IN = bez(0.5, 0, 0.75, 0);      // ease-in
    const EASE_INOUT = bez(0.65, 0, 0.35, 1);  // ease-inout
    const EASE_LINEAR = (p) => Math.min(1, Math.max(0, p)); // ease-linear
    const prog = (f, at, dur, ease) => ease(Math.min(1, Math.max(0, (f - at) / dur)));
    const lerp = (a, b, t) => a + (b - a) * t;
    // 카메라: 월드 점 (cx, cy) 를 화면 가운데에, 배율 s
    const camAt = (el, cx, cy, s) => { el.style.transform = `translate(960px, 540px) scale(${s}) translate(${-cx}px, ${-cy}px)`; };
    function partReady(fr) {
      return new Promise((res) => {
        const loaded = () => { const d = fr.contentDocument; return d && d.readyState === "complete" && d.location.href !== "about:blank"; };
        const go = () => { const d = fr.contentDocument; d.fonts.ready.then(() => Promise.all([...d.images].map((i) => i.decode().catch(() => {})))).then(res); };
        if (loaded()) go(); else fr.addEventListener("load", go, { once: true });
      });
    }
    function ready(root) {
      root.querySelectorAll("iframe[data-src]").forEach((fr) => { if (!fr.getAttribute("src")) fr.src = fr.dataset.src; });
      return document.fonts.ready.then(() => Promise.all([
        ...[...root.querySelectorAll("iframe")].map(partReady),
        ...[...root.querySelectorAll("img")].map((i) => i.decode().catch(() => {})),
      ]));
    }
    // 장면 상태는 모두 장면 프레임 f 하나로 정한다 (어느 프레임으로 바로 가도 같은 그림).
    // 부품 상자 transform 은 GSAP 가 직접 트윈하지 않는다 (iframe 다시 로드 방지) — paint 가 style 을 직접 쓴다.
    function run(id, root, frames, paint) {
      const tl = gsap.timeline({ paused: true });
      const c = { f: 0 };
      const go = () => paint(Math.round(c.f * 1e4) / 1e4);
      tl.fromTo(c, { f: 0 }, { f: frames, duration: frames / FPS, ease: "none", onUpdate: go }, 0);
      root.querySelectorAll("iframe").forEach((fr) => fr.addEventListener("load", () => { go(); fr.contentDocument.fonts.ready.then(go); }));
      go();
      window.__timelines[id] = tl;
    }
    const inner = (fr, sel) => fr.contentDocument && fr.contentDocument.querySelector(sel);
    // ────────────────────────────────────────────────────────────────

    const root = document.getElementById("s8-plane").closest('[data-composition-id="s8"]');
    const $ = (s) => root.querySelector(s);
    const STEP = 980 + 56;                                               // 두 카드 가운데 사이 = 카드 폭 + video-gap
    const T = { pulse: D.m, rail: 2 * D.m, count: 2 * D.m + D.x2l, out: 2 * D.m + 2 * D.x2l + H.m }; // 6 · 12 · 42 · 93
    const paint = (f) => {
      // mission-done: emphasis (진행 바 · 글자)
      const fm = $("#s8-mission iframe");
      const fill = inner(fm, "#mission-card-progress-fill"), txt = inner(fm, "#mission-card-progress-text");
      if (fill && txt) {
        const v = lerp(0.5, 1, prog(f, 0, D.m, EASE_OUT));
        fill.style.setProperty("--progress", String(v));
        const pct = Math.round(v * 100);
        txt.textContent = `${pct}% · ${Math.floor(pct / 25)}/4 단계 완료`;
      }
      // badge-pulse
      $("#s8-badge").style.transform = `scale(${prog(f, T.pulse, D.m, EASE_OUT)})`;
      // card-rail 튕김
      $("#s8-rail").style.transform = `translateX(${-STEP * prog(f, T.rail, D.x2l, EASE_OUT)}px)`;
      // count-up (#stat-card-amount textContent 만)
      const amt = inner($("#s8-stat iframe"), "#stat-card-amount");
      if (amt) {
        const fin = Number(String(amt.dataset.final).replace(/,/g, ""));
        amt.textContent = Math.round(fin * prog(f, T.count, D.x2l, EASE_OUT)).toLocaleString("en-US");
      }
      // scene-out
      $("#s8-plane").style.opacity = String(1 - prog(f, T.out, D.s, EASE_IN));
    };
    ready(root).then(() => run("s8", root, 95, paint));
  })();

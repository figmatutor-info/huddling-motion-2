  <script>
  (() => {
    // ── 공통 (장면 파일마다 같음) ─────────────────────────────────────
    // motion.md 1장: 프레임(30fps) · Duration · Easing 곡선 · 4장 hold
    const F = (n) => n / 30;
    const DUR = { xs: F(2), s: F(3), m: F(6), l: F(12), xl: F(24), x2l: F(30) };
    const HOLD = { s: F(12), m: F(21), l: F(36), end: F(45) };
    function bez(x1, y1, x2, y2) { // cubic-bezier 값을 GSAP ease 함수로 (곡선 값은 motion.md 1장 그대로)
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      return (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let lo = 0, hi = 1, t = p;
        for (let i = 0; i < 50; i++) { const v = sx(t); if (Math.abs(v - p) < 1e-7) break; if (v < p) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const EASE_OUT = bez(0.16, 1, 0.3, 1);      // ease-out
    const EASE_IN = bez(0.5, 0, 0.75, 0);       // ease-in
    const EASE_INOUT = bez(0.65, 0, 0.35, 1);   // ease-inout
    const EASE_LINEAR = "none";                 // ease-linear
    // 부품(iframe) 로드 + 부품 안 폰트 · 이미지 준비 (design.md 3장: 첫 프레임 전에 fonts.ready)
    function partReady(f) {
      return new Promise((res) => {
        const loaded = () => { const d = f.contentDocument; return d && d.readyState === "complete" && d.location.href !== "about:blank"; };
        const go = () => { const d = f.contentDocument; d.fonts.ready.then(() => Promise.all([...d.images].map((i) => i.decode().catch(() => {})))).then(res); };
        if (loaded()) go(); else f.addEventListener("load", go, { once: true });
      });
    }
    function ready(root) {
      // 부품 iframe 은 data-src 로 적고 장면 스크립트가 붙을 때 한 번만 연다 (장면 삽입 중 이중 로드 · 중단 방지)
      root.querySelectorAll("iframe[data-src]").forEach((f) => { if (!f.getAttribute("src")) f.src = f.dataset.src; });
      return document.fonts.ready.then(() => Promise.all([
        ...[...root.querySelectorAll("iframe")].map(partReady),
        ...[...root.querySelectorAll("img")].map((i) => i.decode().catch(() => {})),
      ]));
    }
    function offsetIn(el, root) { let x = 0, y = 0; while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x, y }; }
    // cut-in-motion (motion.md 3장): scene-out(exit, dur-s)이 절반 진행된 프레임 = 장면 끝
    const exitAt = (sceneDur) => sceneDur - DUR.s / 2;
    function sceneOut(tl, target, sceneDur) { tl.fromTo(target, { opacity: 1 }, { opacity: 0, duration: DUR.s, ease: EASE_IN, immediateRender: false }, exitAt(sceneDur)); }
    // ───────────────────────────────────────────────────────────────
    const SCENE = 2.0;                        // 60f = dur-2xl 30 + hold-m 21 + dur-s 3 + dur-m 6 (motion.md 1 · 3 · 4장)
    const root = document.getElementById("s2-cam").closest('[data-composition-id="s2"]');
    const cam = root.querySelector("#s2-cam");
    const phone = root.querySelector("#s2-phone");
    const btn = root.querySelector("#s2-btn");
    const PRESS_SCALE = 0.96;                 // press-scale (motion.md 1장)
    const CAM_IN = 2.4;                       // cam-in (motion.md 1장)
    const DIST_L = 70;                        // dist-l (motion.md 1장) — cam-crane 시작 위치: 머묾 자리보다 아래
    const ANGLE = { rx: 12, ry: -18, persp: 2400 }; // crane-angle (motion.md 1장)
    // cam-in 대상 = 01-home 미션 카드 영역의 가운데 (화면 이미지 780×1688 안에서 카드 x 40–740 · y 588–1094 → 가운데 390 · 841, 이미지에서 잼)
    const TARGET = { x: 390 / 780, y: 841 / 1688 };

    ready(root).then(() => {
      // 폰 화면 가운데: 폰 x (1920 - 444) / 2 = 738 · y (1080 - 928) / 2 = 76 → 화면 (752, 90) 416×900
      const SCR = { x: 738 + 14, y: 76 + 14, w: 416, h: 900 };
      const fx1 = SCR.x + SCR.w * TARGET.x, fy1 = SCR.y + SCR.h * TARGET.y;   // (960, 538.4)
      // cam-crane: 각도 · 위치 · 줌을 같은 p 하나(ease-inout 적용 뒤)로 동시 보간 (motion.md 5장)
      const craneAt = (p) => {
        const q = 1 - p;
        phone.style.transform = `translateY(${DIST_L * q}px) perspective(${ANGLE.persp}px) rotateX(${ANGLE.rx * q}deg) rotateY(${ANGLE.ry * q}deg)`;
        // 줌 × 1 → cam-in, 초점 화면 가운데 → 대상 (cam-pull 계산을 거꾸로 한 것과 같은 식)
        const s = 1 + (CAM_IN - 1) * p, fx = 960 + (fx1 - 960) * p, fy = 540 + (fy1 - 540) * p;
        cam.style.transform = `translate(${960 - fx * s}px, ${540 - fy * s}px) scale(${s})`;
      };

      const tl = gsap.timeline({ paused: true });
      const c = { p: 0 };
      tl.fromTo(c, { p: 0 }, { p: 1, duration: DUR.x2l, ease: EASE_INOUT, onUpdate: () => craneAt(c.p) }, 0);
      // cam-in 상태로 hold-m (카메라 정지) → button-press (motion.md 3장): 누름 dur-s · ease-in → 뗌 dur-m · ease-out
      // 뗌 끝 = 장면 끝 (2.0초) = 장면3 첫 프레임 · scene-out 없음
      const b = { s: 1 };
      const pressAt = () => { btn.style.transform = `scale(${b.s})`; };
      const PRESS = DUR.x2l + HOLD.m;           // 51f
      tl.fromTo(b, { s: 1 }, { s: PRESS_SCALE, duration: DUR.s, ease: EASE_IN, onUpdate: pressAt, immediateRender: false }, PRESS);
      tl.fromTo(b, { s: PRESS_SCALE }, { s: 1, duration: DUR.m, ease: EASE_OUT, onUpdate: pressAt, immediateRender: false }, PRESS + DUR.s);
      craneAt(0);
      pressAt();
      window.__timelines["s2"] = tl;
    });
  })();
  </script>

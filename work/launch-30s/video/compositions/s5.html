  <script>
  (() => {
    // ── 공통 (장면 파일마다 같음) ─────────────────────────────────────
    // motion.md 1장: 프레임(30fps) · Duration · Easing 곡선 · 4장 hold
    const F = (n) => n / 30;
    const DUR = { xs: F(2), s: F(3), m: F(6), l: F(12), xl: F(24), x2l: F(30) };
    const HOLD = { s: F(12), m: F(21), l: F(36), end: F(45) };
    function bez(x1, y1, x2, y2) { // cubic-bezier 값을 GSAP ease 함수로 (곡선 값은 motion.md 1장 그대로)
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      return (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let lo = 0, hi = 1, t = p;
        for (let i = 0; i < 50; i++) { const v = sx(t); if (Math.abs(v - p) < 1e-7) break; if (v < p) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const EASE_OUT = bez(0.16, 1, 0.3, 1);      // ease-out
    const EASE_IN = bez(0.5, 0, 0.75, 0);       // ease-in
    const EASE_INOUT = bez(0.65, 0, 0.35, 1);   // ease-inout
    const EASE_LINEAR = "none";                 // ease-linear
    // 부품(iframe) 로드 + 부품 안 폰트 · 이미지 준비 (design.md 3장: 첫 프레임 전에 fonts.ready)
    function partReady(f) {
      return new Promise((res) => {
        const loaded = () => { const d = f.contentDocument; return d && d.readyState === "complete" && d.location.href !== "about:blank"; };
        const go = () => { const d = f.contentDocument; d.fonts.ready.then(() => Promise.all([...d.images].map((i) => i.decode().catch(() => {})))).then(res); };
        if (loaded()) go(); else f.addEventListener("load", go, { once: true });
      });
    }
    function ready(root) {
      // 부품 iframe 은 data-src 로 적고 장면 스크립트가 붙을 때 한 번만 연다 (장면 삽입 중 이중 로드 · 중단 방지)
      root.querySelectorAll("iframe[data-src]").forEach((f) => { if (!f.getAttribute("src")) f.src = f.dataset.src; });
      return document.fonts.ready.then(() => Promise.all([
        ...[...root.querySelectorAll("iframe")].map(partReady),
        ...[...root.querySelectorAll("img")].map((i) => i.decode().catch(() => {})),
      ]));
    }
    function offsetIn(el, root) { let x = 0, y = 0; while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x, y }; }
    // cut-in-motion (motion.md 3장): scene-out(exit, dur-s)이 절반 진행된 프레임 = 장면 끝
    const exitAt = (sceneDur) => sceneDur - DUR.s / 2;
    function sceneOut(tl, target, sceneDur) { tl.fromTo(target, { opacity: 1 }, { opacity: 0, duration: DUR.s, ease: EASE_IN, immediateRender: false }, exitAt(sceneDur)); }
    // ───────────────────────────────────────────────────────────────
    const SCENE = 1.4;
    const root = document.getElementById("s5-out").closest('[data-composition-id="s5"]');
    ready(root).then(() => {
      const tl = gsap.timeline({ paused: true });
      // 모든 상태를 장면 시간 t 하나로 정한다 (어느 프레임으로 바로 가도 같은 그림).
      // GSAP 로 부품 상자의 transform 을 직접 트윈하면 GSAP 가 transform 을 읽으려고 상자를 잠깐 옮겨 iframe 이 다시 로드되고
      // 부품 안 인라인 상태가 사라진다 → transform 도 여기서 직접 쓰고, iframe 이 다시 로드되면 다시 그린다.
      const frame = root.querySelector("#s5-button iframe");
      const boxEl = root.querySelector("#s5-button");
      const outEl = root.querySelector("#s5-out");
      const btnEl = () => frame.contentDocument && frame.contentDocument.getElementById("button-submit");
      const prog = (t, at, dur, ease) => ease(Math.min(1, Math.max(0, (t - at) / dur)));
      const T1 = DUR.m + HOLD.m;   // part-in 뒤 hold-m → shape-morph 시작 (27f)
      const T2 = T1 + DUR.s;       // 글자 exit 끝 → 원으로 (30f)
      const T3 = T2 + DUR.m;       // 원 → 점 (36f), T3 + dur-m = 42f = 장면 끝
      const clock = { t: 0 };
      const paint = () => {
        const t = clock.t;
        // part-in = enter + 마스크 대신 위 dist-m(24px) · 투명도 0 → 1 (dur-m · ease-out)
        const pi = prog(t, 0, DUR.m, EASE_OUT);
        // 2) 가로 폭이 높이(44)와 같아질 때까지 줄어 원 · dur-m · ease-in (가운데 기준 → 상자를 (350 − w) / 2 × 2.8 오른쪽으로)
        const pw = prog(t, T2, DUR.m, EASE_IN);
        // 3) 원이 scale-from(0)까지 줄어듦 · dur-m · ease-in, 중심 = 원 가운데 = 화면 가운데
        const ps = prog(t, T3, DUR.m, EASE_IN);
        boxEl.style.opacity = String(pi);
        boxEl.style.transform = `translate(${(350 - 44) / 2 * 2.8 * pw}px, ${-24 * (1 - pi)}px)`;
        outEl.style.transformOrigin = "960px 540px";
        outEl.style.transform = `scale(${1 - ps})`;
        const b = btnEl(); if (!b) return;
        // 1) 버튼 글자 exit (dur-s · ease-in · 투명도 1 → 0)
        b.querySelector(".label").style.opacity = String(1 - prog(t, T1, DUR.s, EASE_IN));
        b.style.height = "44px"; // 원래 높이 (padding 12 × 2 + Text/label 행간 20) 고정 — 좁아질 때 글자 줄바꿈으로 늘어나지 않게
        b.style.width = (350 + (44 - 350) * pw) + "px";
        b.style.borderRadius = (8 + (22 - 8) * pw) + "px";
      };
      frame.addEventListener("load", paint);
      tl.fromTo(clock, { t: 0 }, { t: SCENE, duration: SCENE, ease: "none", onUpdate: paint }, 0);
      // 장면 끝 = 점 → 장면6 첫 프레임에 transition (scene-out 없음)
      paint();
      window.__timelines["s5"] = tl;
    });
  })();

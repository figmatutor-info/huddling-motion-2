  (() => {
    // ── 공통 (장면 파일마다 같음) ─────────────────────────────────────
    // motion.md 1장: 프레임(30fps) · Duration · Easing 곡선 · 4장 hold
    const F = (n) => n / 30;
    const DUR = { xs: F(2), s: F(3), m: F(6), l: F(12), xl: F(24), x2l: F(30) };
    const HOLD = { s: F(12), m: F(21), l: F(36), end: F(45) };
    function bez(x1, y1, x2, y2) { // cubic-bezier 값을 GSAP ease 함수로 (곡선 값은 motion.md 1장 그대로)
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      return (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let lo = 0, hi = 1, t = p;
        for (let i = 0; i < 50; i++) { const v = sx(t); if (Math.abs(v - p) < 1e-7) break; if (v < p) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const EASE_OUT = bez(0.16, 1, 0.3, 1);      // ease-out
    const EASE_IN = bez(0.5, 0, 0.75, 0);       // ease-in
    const EASE_INOUT = bez(0.65, 0, 0.35, 1);   // ease-inout
    const EASE_LINEAR = "none";                 // ease-linear
    // 부품(iframe) 로드 + 부품 안 폰트 · 이미지 준비 (design.md 3장: 첫 프레임 전에 fonts.ready)
    function partReady(f) {
      return new Promise((res) => {
        const loaded = () => { const d = f.contentDocument; return d && d.readyState === "complete" && d.location.href !== "about:blank"; };
        const go = () => { const d = f.contentDocument; d.fonts.ready.then(() => Promise.all([...d.images].map((i) => i.decode().catch(() => {})))).then(res); };
        if (loaded()) go(); else f.addEventListener("load", go, { once: true });
      });
    }
    function ready(root) {
      // 부품 iframe 은 data-src 로 적고 장면 스크립트가 붙을 때 한 번만 연다 (장면 삽입 중 이중 로드 · 중단 방지)
      root.querySelectorAll("iframe[data-src]").forEach((f) => { if (!f.getAttribute("src")) f.src = f.dataset.src; });
      return document.fonts.ready.then(() => Promise.all([
        ...[...root.querySelectorAll("iframe")].map(partReady),
        ...[...root.querySelectorAll("img")].map((i) => i.decode().catch(() => {})),
      ]));
    }
    function offsetIn(el, root) { let x = 0, y = 0; while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x, y }; }
    // cut-in-motion (motion.md 3장): scene-out(exit, dur-s)이 절반 진행된 프레임 = 장면 끝
    const exitAt = (sceneDur) => sceneDur - DUR.s / 2;
    function sceneOut(tl, target, sceneDur) { tl.fromTo(target, { opacity: 1 }, { opacity: 0, duration: DUR.s, ease: EASE_IN, immediateRender: false }, exitAt(sceneDur)); }
    // ───────────────────────────────────────────────────────────────
    const SCENE = 3.0;
    const root = document.getElementById("s3-row").closest('[data-composition-id="s3"]');
    const STEP_X = 980 + 56;                  // skill-carousel 거리 = 카드 폭 + video-gap
    ready(root).then(() => {
      const tl = gsap.timeline({ paused: true });
      // 카드 1 hold-m 뒤 왼쪽으로 한 장 (dur-l · ease-inout)
      tl.fromTo("#s3-row", { "--tx": "0px" }, { "--tx": -STEP_X + "px", duration: DUR.l, ease: EASE_INOUT }, HOLD.m);
      const t2 = HOLD.m + DUR.l + HOLD.m;                                                                              // 카드 2 hold-m 뒤
      tl.fromTo("#s3-row", { "--tx": -STEP_X + "px" }, { "--tx": -2 * STEP_X + "px", duration: DUR.l, ease: EASE_INOUT, immediateRender: false }, t2);
      // 카드 3 hold-m 뒤 scene-out
      sceneOut(tl, "#s3-out", SCENE);
      window.__timelines["s3"] = tl;
    });

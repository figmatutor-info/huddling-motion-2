  <script>
  (() => {
    // ── 공통 (장면 파일마다 같음) ─────────────────────────────────────
    // motion.md 1장: 프레임(30fps) · Duration · Easing 곡선 · 4장 hold
    const F = (n) => n / 30;
    const DUR = { xs: F(2), s: F(3), m: F(6), l: F(12), xl: F(24), x2l: F(30) };
    const HOLD = { s: F(12), m: F(21), l: F(36), end: F(45) };
    function bez(x1, y1, x2, y2) { // cubic-bezier 값을 GSAP ease 함수로 (곡선 값은 motion.md 1장 그대로)
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      return (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let lo = 0, hi = 1, t = p;
        for (let i = 0; i < 50; i++) { const v = sx(t); if (Math.abs(v - p) < 1e-7) break; if (v < p) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const EASE_OUT = bez(0.16, 1, 0.3, 1);      // ease-out
    const EASE_IN = bez(0.5, 0, 0.75, 0);       // ease-in
    const EASE_INOUT = bez(0.65, 0, 0.35, 1);   // ease-inout
    const EASE_LINEAR = "none";                 // ease-linear
    // 부품(iframe) 로드 + 부품 안 폰트 · 이미지 준비 (design.md 3장: 첫 프레임 전에 fonts.ready)
    function partReady(f) {
      return new Promise((res) => {
        const loaded = () => { const d = f.contentDocument; return d && d.readyState === "complete" && d.location.href !== "about:blank"; };
        const go = () => { const d = f.contentDocument; d.fonts.ready.then(() => Promise.all([...d.images].map((i) => i.decode().catch(() => {})))).then(res); };
        if (loaded()) go(); else f.addEventListener("load", go, { once: true });
      });
    }
    function ready(root) {
      // 부품 iframe 은 data-src 로 적고 장면 스크립트가 붙을 때 한 번만 연다 (장면 삽입 중 이중 로드 · 중단 방지)
      root.querySelectorAll("iframe[data-src]").forEach((f) => { if (!f.getAttribute("src")) f.src = f.dataset.src; });
      return document.fonts.ready.then(() => Promise.all([
        ...[...root.querySelectorAll("iframe")].map(partReady),
        ...[...root.querySelectorAll("img")].map((i) => i.decode().catch(() => {})),
      ]));
    }
    function offsetIn(el, root) { let x = 0, y = 0; while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x, y }; }
    // cut-in-motion (motion.md 3장): scene-out(exit, dur-s)이 절반 진행된 프레임 = 장면 끝
    const exitAt = (sceneDur) => sceneDur - DUR.s / 2;
    function sceneOut(tl, target, sceneDur) { tl.fromTo(target, { opacity: 1 }, { opacity: 0, duration: DUR.s, ease: EASE_IN, immediateRender: false }, exitAt(sceneDur)); }
    // ───────────────────────────────────────────────────────────────
    const SCENE = 2.7;
    const root = document.getElementById("s1-cam").closest('[data-composition-id="s1"]');
    const cam = root.querySelector("#s1-cam");
    const line = root.querySelector("#s1-line");
    const cursor = root.querySelector("#s1-cursor");
    const chars = [...line.querySelectorAll(".ch")];
    const STEP = DUR.s;                       // type-step = dur-s (motion.md 1장)
    const TYPE_END = chars.length * STEP;     // 15글자 × 3프레임 = 45프레임
    const LAST = (chars.length - 1) * STEP;   // 끝 글자가 나타나는 때
    const CAM_IN = 2.4;                       // cam-in (motion.md 1장)
    const PULL_START = TYPE_END, PULL_END = TYPE_END + DUR.l; // cam-pull dur-l · ease-inout

    ready(root).then(() => document.fonts.load('700 78px "Pretendard"')).then(() => {
      // 글자 오른쪽 끝 (line 안 좌표). 줄이 그려져 있으면 span 위치를 그대로 쓰고 (스냅보드와 같은 값),
      // 장면이 가려진 때 빌드되면 글자 폭으로 계산한다. 최종 배치 = 가운데: 줄 폭 = 글자 폭 + 커서 자리 12
      let rights, lineW;
      if (line.offsetWidth > 0) {
        rights = chars.map((c) => c.offsetLeft + c.offsetWidth);
        lineW = line.offsetWidth;
      } else {
        const ctx = document.createElement("canvas").getContext("2d");
        ctx.font = '700 78px "Pretendard"';
        const widths = chars.map((c) => ctx.measureText(c.textContent).width);
        rights = widths.map((_, i) => widths.slice(0, i + 1).reduce((a, b) => a + b, 0));
        lineW = rights[rights.length - 1] + 12;
      }
      const lineX = (1920 - lineW) / 2;
      const curX = (n) => rights[n - 1] + 6;                                 // 끝 글자와 6px 띄움
      const camY = 540;
      const focusAt = (n) => lineX + curX(n) + 3;                            // 커서 가운데
      const f0 = focusAt(1), f1 = focusAt(chars.length);

      function render(t) {
        const n = Math.min(chars.length, Math.floor(t / STEP + 1e-6) + 1);   // 글자가 type-step마다 하나씩 그냥 나타남
        chars.forEach((c, i) => { c.style.opacity = i < n ? "1" : "0"; });
        cursor.style.left = curX(n) + "px";
        let s, fx, fy = camY;
        if (t < LAST) { s = CAM_IN; fx = f0 + (f1 - f0) * (t / LAST); }      // cam-follow: ease-linear
        else if (t < PULL_START) { s = CAM_IN; fx = f1; }
        else if (t < PULL_END) {                                              // cam-pull: cam-in → × 1 · 가운데로 · ease-inout
          const p = EASE_INOUT((t - PULL_START) / (PULL_END - PULL_START));
          s = CAM_IN + (1 - CAM_IN) * p; fx = f1 + (960 - f1) * p; fy = camY + (540 - camY) * p;
        } else { s = 1; fx = 960; fy = 540; }                                 // cam-hold
        cam.style.transform = `translate(${960 - fx * s}px, ${540 - fy * s}px) scale(${s})`;
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: SCENE, duration: SCENE, ease: "none", onUpdate: () => render(clock.t) }, 0);
      // hold-m (PULL_END → exitAt) 뒤 scene-out
      sceneOut(tl, "#s1-out", SCENE);
      render(0);
      window.__timelines["s1"] = tl;
    });
  })();
  </script>

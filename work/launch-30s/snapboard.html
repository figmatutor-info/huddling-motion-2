  2장: cam-crane 시작(#s02a) · cam-crane 끝 = cam-in 상태 hold-m(#s02b) · button-press 눌린 순간(#s02c) 세 컷.
  3장(skill-carousel): 카드 1장째가 가운데인 컷(#s03) + 2 · 3장째 컷(#s03b · #s03c)을 보드에 작게.
  4장(slot-roll): 첫 단어 "리서치" 상태(#s04) · 마지막 단어 "업무 자동화" 상태(#s04b).
  5장(shape-morph 앞부분): button-submit submit hold-m(#s05) · 원이 된 순간(#s05b).
  6장: badge-approved shape-morph 뒷부분 끝(scale 1) 뒤 hold-s(#s06).
  10장(punch-cut): 와이드 = end-reveal 끝 hold-s(#s10) · 클로즈 = cut-scale, 심볼 화면 가운데, logo만(#s10b) — hold-end 정지.
  값 출처: docs/video.md 1~5장 · docs/design.md 1~3장 · docs/motion.md.
  쓴 이름 목록: used-snapboard.md
  부품 · 화면: src/parts/*.html (iframe, 원본 파일 그대로 · 상태는 ?state= 로만) · src/screens/01-home.png
  #s05b만: 움직임(shape-morph) 중간 상태를 장면 스크립트가 iframe 안 요소에 인라인 스타일로 건다 (파일은 고치지 않음).
  열기: 저장소 루트에서 로컬 서버로 연다 (예: python3 -m http.server → /work/launch-30s/snapboard.html).
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>snapboard — launch-30s</title>
<style>
  /* design.md 3장 A · video.md 3장: 로컬 파일 */
  @font-face { font-family: "Pretendard"; font-weight: 400; src: url("../../src/assets/fonts/Pretendard-Regular.otf") format("opentype"); }
  @font-face { font-family: "Pretendard"; font-weight: 600; src: url("../../src/assets/fonts/Pretendard-SemiBold.otf") format("opentype"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; src: url("../../src/assets/fonts/Pretendard-Bold.otf") format("opentype"); }

  :root {
    /* video.md 2장 배경 */
    --video-bg: #ffffff;
    --video-bg-soft: #f7f7f8;
    --video-bg-dark: #18191b;
    /* video.md 3장 글자 색 */
    --video-text: #18191b;
    --video-text-muted: #75777c;
    --video-text-accent: #3759de;
    --video-text-on-dark: #ffffff;
    /* video.md 3장 간격 */
    --video-gap: 56px;
    --video-gap-end: 48px;
    /* video.md 4장 폰 프레임 */
    --phone-bezel: 14px;
    --phone-radius-outer: 64px;
    --phone-radius-screen: 50px;
    --phone-color: #18191b;
    --phone-screen-bg: #ffffff;
  }

  html, body { margin: 0; padding: 0; }
  body { font-family: "Pretendard", sans-serif; }

  .cut {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    word-break: keep-all; /* video.md 3장 */
  }
  .bg-soft { background: var(--video-bg-soft); }
  .bg { background: var(--video-bg); }

  /* video.md 3장 글자 스타일 */
  .video-display { font-weight: 700; font-size: 78px; line-height: 95px; }
  .video-title   { font-weight: 600; font-size: 67px; line-height: 90px; }
  .video-heading { font-weight: 600; font-size: 50px; line-height: 78px; }
  .t-text    { color: var(--video-text); }
  .t-muted   { color: var(--video-text-muted); }
  .t-accent  { color: var(--video-text-accent); }
  .t-on-dark { color: var(--video-text-on-dark); }
  p { margin: 0; }

  /* 묶음 전체 화면 가운데 (video.md 3장). 화면 가운데 한 줄 장면(훅 · dark-cut · 엔드)은 글자 가운데 정렬 */
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .center.one-line { text-align: center; }

  /* 2장: 폰 하나 — 화면 가운데 (가로 · 세로, video.md 3장 · 장면표) */
  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: row; align-items: center; justify-content: center;
  }
  .phone {
    flex: none;
    box-sizing: border-box;
    width: 444px; height: 928px;               /* phone-size */
    padding: var(--phone-bezel);
    border-radius: var(--phone-radius-outer);
    background: var(--phone-color);
  }
  .phone img {
    display: block;
    width: 416px; height: 900px;               /* phone-screen */
    border-radius: var(--phone-radius-screen);
    background: var(--phone-screen-bg);
  }

  .gap     { height: var(--video-gap); flex: none; }
  .gap-end { height: var(--video-gap-end); flex: none; }

  /* parts: video.md 5장 — 부품 전체에 × 2.8 한 번 */
  .part { flex: none; position: relative; }
  .part iframe {
    position: absolute; left: 0; top: 0;
    border: 0; background: transparent;
    transform: scale(2.8); transform-origin: 0 0;
  }
  .p-stat    { width: 980px; height: 226.8px; } .p-stat    iframe { width: 350px; height: 81px; }
  .p-asset   { width: 980px; height: 207.2px; } .p-asset   iframe { width: 350px; height: 74px; }
  .p-skill   { width: 980px; height: 134.4px; } .p-skill   iframe { width: 350px; height: 48px; }
  .p-button  { width: 980px; height: 123.2px; } .p-button  iframe { width: 350px; height: 44px; }
  /* logo-hero: video.md 5장 배율 예외 × 6 */
  .p-logo-hero { width: 894px; height: 114px; } .p-logo-hero iframe { width: 149px; height: 19px; transform: scale(6); }

  /* 1장 text-type 끝 글자 뒤 커서 (motion.md 3장 text-type):
     폭 6px · 끝 글자와 6px 띄움 · 높이 = video-display 행간 95 (video.md 3장) · 색 video-text */
  .cursor {
    display: inline-block;
    width: 6px; height: 95px;
    margin-left: 6px;
    vertical-align: top;
    background: var(--video-text);
  }

  /* 3장 skill-carousel (motion.md 3장): 카드 3장 가로 한 줄, 카드 사이 video-gap.
     보이는 카드를 화면 가운데(가로 · 세로) → 줄의 왼쪽 끝 = (1920 - 980) / 2 - n × (980 + 56) */
  .carousel {
    position: absolute; top: 0; height: 1080px;
    display: flex; flex-direction: row; align-items: center;
    gap: var(--video-gap);
  }
  #s03  .carousel { left: 470px; }    /* 카드 1 가운데 */
  #s03b .carousel { left: -566px; }   /* 왼쪽으로 한 장 (980 + 56) → 카드 2 가운데 */
  #s03c .carousel { left: -1602px; }  /* 왼쪽으로 두 장 → 카드 3 가운데 */

  /* 2장 카메라 (motion.md 5장 cam-crane, 다음 cam-pull 생략 → cam-in 상태로 hold-l). 부제 · mission-card 부품 없음 (장면표) */
  .cam { position: absolute; inset: 0; transform-origin: 0 0; }
  /* 02a: cam-crane 시작 (motion.md 5장) = 폰이 머묾 자리보다 아래 dist-l 70px (1장) · × 1
     + crane-angle (1장) rotateX 12° · rotateY -18° · perspective 2400px · 회전 중심 폰 가운데 (transform-origin 50% 50%) */
  #s02a .phone {
    transform-origin: 50% 50%;
    transform: translateY(70px) perspective(2400px) rotateX(12deg) rotateY(-18deg);
  }
  /* 02b: cam-crane 끝 = 각도 0 · cam-in × 2.4 (motion.md 1장), 대상 = 01-home 미션 카드 영역 가운데
     대상 점 (화면 이미지 780×1688 안 390 · 841, video/compositions/s2.html과 같은 잰 값)
     폰 가운데 → 폰 x 738–1182 · y 76–1004, 화면 x 752–1168 · y 90–990
     → 컷 좌표 fx = 752 + 416 × 390/780 = 960 · fy = 90 + 900 × 841/1688 = 538.40
     → translate(960 - 960 × 2.4, 540 - 538.40 × 2.4) scale(2.4) */
  #s02b .cam, #s02c .cam { transform: translate(-1344px, -752.16px) scale(2.4); }

  /* 02b · 02c: button-submit apply-case를 01-home 화면 이미지 속 "적용 사례 정리하기 →" 버튼 자리에 겹침 (장면표 · motion.md 3장 button-press)
     화면 이미지 속 버튼 (잰 값): 이미지 780×1688 안 x 74–709 · y 972–1059 (636×88 = 부품 318×44 @2x)
     배율 = 화면 이미지와 같게 phone-screen 416 / 390 = 1.066667 (video.md 4장) · 부품 전체에 한 번
     위치 (폰 안, 베젤 포함) left = 14 + 74 × 416/780 = 53.4667 · top = 14 + 972 × 900/1688 = 532.2464
     → 부품 영역 339.2×46.9333 (폰 좌표) · cam-in × 2.4 뒤 컷 좌표 x 555.49–1369.54 · y 707.60–820.22 (814.05×112.64) */
  .phone { position: relative; }
  .phone .overlay-btn {
    position: absolute; left: 53.4667px; top: 532.2464px;
    width: 339.2px; height: 46.9333px;
  }
  .phone .overlay-btn iframe {
    position: absolute; left: 0; top: 0; border: 0; background: transparent;
    width: 318px; height: 44px;
    transform: scale(1.066667); transform-origin: 0 0;
  }
  /* 02a · 02b · 02c: 덮개판 (video.md 4장 예외 줄) — 부품 바로 아래, 같은 크기 · 같은 모서리 · 색 phone-screen-bg (= color-bg).
     모서리 = 부품 border-radius 8px × 같은 배율 1.066667 = 8.5333px. 덮개판은 고정, 누름(press-scale)은 부품에만 */
  .phone .overlay-cover {
    /* 사방 1px @1x 크게 (video.md 4장) = 1 × 1.066667 (phone-screen 배율) = 1.0667px */
    position: absolute; left: 52.4px; top: 531.1797px;
    width: 341.3333px; height: 49.0667px;
    border-radius: 8.5333px;
    background: var(--phone-screen-bg);
  }
  /* 02c: button-press 누름 끝 = press-scale 0.96 (motion.md 1장), 중심 = 버튼 가운데 (motion.md 3장 button-press), 부품만 — 덮개판은 고정 */
  #s02c .overlay-btn { transform: scale(0.96); transform-origin: 50% 50%; }

  /* 6장 badge-approved (video.md 5장 × 2.8 = 302.4×89.6) */
  .p-badge { width: 302.4px; height: 89.6px; } .p-badge iframe { width: 108px; height: 32px; }

  /* 5b shape-morph 중간 = 원이 된 순간 (motion.md 3장 shape-morph): 글자 exit 끝(투명도 0) · 버튼 가로 폭 = 높이 44 (× 2.8 = 123.2) · 원.
     부품 안 #button-submit에 width 44px · height 44px(원래 높이 고정) · border-radius 22px(높이 절반) · .label opacity 0 을 스크립트로 건다 (아래 script).
     부품 안 버튼은 왼쪽에 붙어 있어, 가운데를 지키려고 부품 상자 전체를 (350 - 44) / 2 × 2.8 = 428.4px 오른쪽으로 옮김 → 원 x 898.4–1021.6 (가운데 960) */
  #s05b .p-button { transform: translateX(428.4px); }

  /* 10b punch-cut 클로즈 (motion.md 3장 · 1장 cut-scale × 1.7): 같은 logo-hero(× 6)에 × 1.7.
     프레이밍 = logotype 안 심볼을 화면 가운데. 심볼 = logotype svg 앞 5개 path, 상자 x 0–14.4871 · y 2.0016–16.9796 (getBBox 잰 값)
     → 심볼 가운데 (7.2436, 9.4906) × 6 = (43.4614, 56.9436) → logo-hero 상자 left 960 - 43.4614 = 916.5386 · top 540 - 56.9436 = 483.0564,
     그 점을 중심으로 scale(1.7) → 심볼 가운데가 (960, 540)에 남음. 슬로건 없음 (punch-cut 정의). */
  #s10b .p-logo-hero {
    position: absolute; left: 916.5386px; top: 483.0564px;
    transform: scale(1.7); transform-origin: 43.4614px 56.9436px;
  }

  /* 10장 video-bg-end (video.md 2장) */
  .bg-end { background: var(--video-bg-dark); }
  .bg-end .glow {
    position: absolute; left: 50%; top: 50%;
    width: 1200px; height: 1200px; margin: -600px 0 0 -600px;
    border-radius: 50%;
    background: radial-gradient(circle closest-side, rgba(55, 89, 222, 0.45), rgba(55, 89, 222, 0));
    filter: blur(160px);
  }
  .bg-end canvas.grain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0.06; }

  /* 보드 틀 (영상 아님): 3장 2 · 3장째 컷을 반 크기로 나란히 */
  .board-row { display: flex; flex-direction: row; width: 1920px; height: 540px; overflow: hidden; }
  .board-row .mini { width: 960px; height: 540px; overflow: hidden; }
  .board-row .mini .cut { transform: scale(0.5); transform-origin: 0 0; }
</style>

    <div class="part p-logo-hero"><iframe src="../../src/parts/logo.html?state=logotype-white"></iframe></div>
    <div class="gap-end"></div>
    <p class="video-title t-on-dark">오늘도 하나씩, 내 실력으로</p>
  </div>
</section>

<!-- 10b · 머묾 = punch-cut 클로즈 (transition 컷 → cut-scale, 심볼 화면 가운데, logo만) → hold-end 마지막 정지 -->
<section class="cut bg-end" id="s10b" data-scene="10b">
  <div class="glow"></div>
  <canvas class="grain" width="1920" height="1080"></canvas>
  <div class="part p-logo-hero"><iframe src="../../src/parts/logo.html?state=logotype-white"></iframe></div>
</section>

<script>
  // video-grain (video.md 2장): #ffffff 노이즈 · 1px · 알파 0–255 고르게 · seed 1 · 고정 · mulberry32
  (function grain() {
    let s = 1;
    const rand = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const cs = document.querySelectorAll("canvas.grain");
    const ctx0 = cs[0].getContext("2d");
    const img = ctx0.createImageData(cs[0].width, cs[0].height), d = img.data;
    for (let i = 0; i < d.length; i += 4) { d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; d[i + 3] = Math.floor(rand() * 256); }
    cs.forEach((c) => c.getContext("2d").putImageData(img, 0, 0)); // seed 1 한 장을 10 · 10b에 같이 (고정)
  })();

  // 5b shape-morph 중간 상태 (motion.md 3장): 글자 exit 끝 · 폭 = 높이 · 원. 부품 파일은 그대로, 움직임 상태만 인라인으로
  function morphCircle(f) {
    const d = f.contentDocument; if (!d) return;
    const btn = d.getElementById("button-submit"); if (!btn) return;
    btn.style.width = "44px";          // 버튼 높이 (padding 12 × 2 + Text/label 행간 20)
    btn.style.height = "44px";         // 높이는 그대로 (글자가 좁은 폭에서 줄바꿈돼 늘어나지 않게 고정)
    btn.style.borderRadius = "22px";   // 높이 절반 → 원
    btn.querySelector(".label").style.opacity = "0"; // exit 끝
  }
  document.querySelectorAll('iframe[data-morph="circle"]').forEach((f) => {
    if (f.contentDocument && f.contentDocument.readyState === "complete" && f.contentDocument.getElementById("button-submit")) morphCircle(f);
    f.addEventListener("load", () => morphCircle(f));
  });
</script>
</body>

    // ── 공통 (장면 파일마다 같음 · launch-b 와 같은 방식) ─────────────────
    const FPS = 30;
    const D = { xs: 2, s: 3, m: 6, l: 12, xl: 24, x2l: 30 };   // motion.md 1장 Duration (프레임)
    const H = { s: 12, m: 21, l: 36, end: 45 };                 // motion.md 4장 hold (프레임)
    function bez(x1, y1, x2, y2) {                              // cubic-bezier → 함수 (곡선 값은 motion.md 1장 그대로)
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
      return (p) => {
        if (p <= 0) return 0; if (p >= 1) return 1;
        let lo = 0, hi = 1, t = p;
        for (let i = 0; i < 50; i++) { const v = sx(t); if (Math.abs(v - p) < 1e-7) break; if (v < p) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const EASE_OUT = bez(0.16, 1, 0.3, 1);     // ease-out
    const EASE_IN = bez(0.5, 0, 0.75, 0);      // ease-in
    const EASE_INOUT = bez(0.65, 0, 0.35, 1);  // ease-inout
    const EASE_LINEAR = (p) => Math.min(1, Math.max(0, p)); // ease-linear
    const prog = (f, at, dur, ease) => ease(Math.min(1, Math.max(0, (f - at) / dur)));
    const lerp = (a, b, t) => a + (b - a) * t;

        const loaded = () => { const d = fr.contentDocument; return d && d.readyState === "complete" && d.location.href !== "about:blank"; };

        if (loaded()) go(); else fr.addEventListener("load", go, { once: true });
      });
    }
    function ready(root) {

    // 장면 상태는 모두 장면 프레임 f 하나로 정한다 (어느 프레임으로 바로 가도 같은 그림).

      go();
      window.__timelines[id] = tl;
    }
    const inner = (fr, sel) => fr.contentDocument && fr.contentDocument.querySelector(sel);
    // ────────────────────────────────────────────────────────────────


    const root = document.getElementById("s3-cam").closest('[data-composition-id="s3"]');
    const $ = (s) => root.querySelector(s);
    const PRESS_SCALE = 0.96;                                // motion.md 1장 press-scale
    const STOPS = [[960, 540], [0, 1620], [960, 2700], [0, 3780], [960, 4860], [0, 5940]];
    const PAN_AT = [0, 42, 81, 111, 165];                    // 항목마다 cam-pan 시작 프레임
    const SOFT = [247, 247, 248], BG = [255, 255, 255];      // video-bg-soft #f7f7f8 · video-bg #ffffff
    const T = { press: 33, emph: 54, pulse: 93, count: 123, shift: 165 };
    const paint = (f) => {

      PAN_AT.forEach((at, k) => { const p = prog(f, at, D.l, EASE_INOUT); x = lerp(x, STOPS[k + 1][0], p); y = lerp(y, STOPS[k + 1][1], p); });
      camAt($("#s3-cam"), x, y, 1);
      // pan-bg-shift
      const b = prog(f, T.shift, D.l, EASE_LINEAR);
      $("#s3-bg").style.background = `rgb(${SOFT.map((v, i) => Math.round(lerp(v, BG[i], b))).join(", ")})`;
      // ① button-press
      const k = f < T.press + D.s ? lerp(1, PRESS_SCALE, prog(f, T.press, D.s, EASE_IN)) : lerp(PRESS_SCALE, 1, prog(f, T.press + D.s, D.m, EASE_OUT));
      $("#s3-btn").style.transform = `translate(-50%, -50%) scale(${k})`;
      // ② emphasis (mission-in 뒷부분)
      const fm = $("#s3-mission iframe");

        txt.textContent = `${pct}% · ${Math.floor(pct / 25)}/4 단계 완료`;

        amt.textContent = Math.round(fin * prog(f, T.count, D.x2l, EASE_OUT)).toLocaleString("en-US");
